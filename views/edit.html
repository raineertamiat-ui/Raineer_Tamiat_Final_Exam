<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Edit Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="text-gray-200 font-sans antialiased">
    <nav class="glass-card sticky top-0 z-50 px-6 py-4 mb-12 shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="font-bold text-xl tracking-wider text-white"> </span>
            <div class="flex space-x-6 text-sm font-medium">
                <a href="/" class="hover:text-indigo-400 transition-colors">Home</a>
                <a href="/list" class="hover:text-indigo-400 transition-colors">Student List</a>
                <a href="/register" class="hover:text-indigo-400 transition-colors">Register Form</a>
            </div>
        </div>
    </nav>
    <main class="max-w-lg mx-auto px-4">
        <div class="glass-card rounded-2xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6">Edit Student Form</h2>
            <form id="editStudentForm" onsubmit="handleEdit(event)">
                <input type="hidden" id="formId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Student ID</label>
                        <input type="text" id="student_id" required class="glass-input w-full px-4 py-3 rounded-xl transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Full Name</label>
                        <input type="text" id="full_name" required class="glass-input w-full px-4 py-3 rounded-xl transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Course</label>
                        <input type="text" id="course" required class="glass-input w-full px-4 py-3 rounded-xl transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Year Level</label>
                        <select id="year_level" required class="glass-input w-full px-4 py-3 rounded-xl transition-all bg-slate-900">
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
                        <input type="email" id="email_address" required class="glass-input w-full px-4 py-3 rounded-xl transition-all">
                    </div>
                </div>
                <div class="mt-8 flex justify-end space-x-3">
                    <a href="/list" class="px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-white/10 transition-colors flex items-center">Cancel</a>
                    <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition-all shadow-lg shadow-amber-600/30">Save Modifications</button>
                </div>
            </form>
        </div>
    </main>
    <script src="/js/main.js"></script>
</body>
</html>
