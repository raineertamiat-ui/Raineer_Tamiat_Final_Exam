<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="text-gray-200 font-sans antialiased">
    <nav class="glass-card sticky top-0 z-50 px-6 py-4 mb-12 shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="font-bold text-xl tracking-wider text-white"> </span>
            <div class="flex space-x-6 text-sm font-medium">
                <a href="/" class="text-indigo-400 font-semibold">Home</a>
                <a href="/list" class="hover:text-indigo-400 transition-colors">Student List</a>
                <a href="/register" class="hover:text-indigo-400 transition-colors">Register Form</a>
            </div>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 text-center">
        <div class="glass-card rounded-2xl p-12 shadow-2xl">
            <h1 class="text-5xl font-extrabold text-white mb-4 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-indigo-200 to-indigo-400">
                Welcome to SIMS
            </h1>
            <p class="text-gray-400 max-w-xl mx-auto mb-8">
                IT318 System Portal Module. Add, modify, drop, and structure records integrated inside cloud architecture.
            </p>
            <div class="flex justify-center space-x-4">
                <a href="/list" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium transition-all shadow-lg shadow-indigo-600/30">View Database Table</a>
                <a href="/register" class="bg-white/10 hover:bg-white/15 text-white border border-white/10 px-6 py-3 rounded-xl font-medium transition-all">Add Student</a>
            </div>
        </div>
    </main>
</body>
</html>
